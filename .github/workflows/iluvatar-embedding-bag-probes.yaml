name: Iluvatar embedding bag diagnostics
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/iluvatar-embedding-bag-probes.yaml'
      - '.github/workflows/iluvatar-embedding-bag-probes-parallel.yaml'
      - '.github/scripts/test_iluvatar_async_errors.py'
      - '.github/scripts/iluvatar-embedding-bag-async-warmup.patch'
      - '.github/scripts/ix_embedding_bag_baseline.py'

permissions:
  contents: read

jobs:
  ix-diagnostics:
    if: github.head_ref == 'ci/iluvatar-embedding-bag-probes'
    runs-on: iluvatar
    timeout-minutes: 90
    container:
      image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-iluvatar-corex4.5.0:2.2.0
      options: --device /dev/iluvatar0 --device /dev/itrctl --shm-size=256g --ulimit memlock=-1 --ulimit stack=67108864
    concurrency:
      group: ix-embedding-bag-probes-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        continue-on-error: true
      - uses: flagos-ai/FlagGems/.github/actions/checkout-retry@505d8b4c9440c710446f857942263c7f7bc3b1b8
      - name: Check out the pinned IX operator (attempt 1)
        id: operator-checkout-1
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: siliconflow/FlagGems
          ref: 2d9f6e395c3dd4642c0bf301be11629356eb92df
          fetch-depth: 1
          path: operator-source
      - name: Check out the pinned IX operator (attempt 2)
        id: operator-checkout-2
        if: ${{ !cancelled() && steps.operator-checkout-1.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: siliconflow/FlagGems
          ref: 2d9f6e395c3dd4642c0bf301be11629356eb92df
          fetch-depth: 1
          path: operator-source
      - name: Check out the pinned IX operator (attempt 3)
        id: operator-checkout-3
        if: ${{ !cancelled() && steps.operator-checkout-2.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: siliconflow/FlagGems
          ref: 2d9f6e395c3dd4642c0bf301be11629356eb92df
          fetch-depth: 1
          path: operator-source
      - name: Check out the pinned IX operator (attempt 4)
        id: operator-checkout-4
        if: ${{ !cancelled() && steps.operator-checkout-3.outcome == 'failure' }}
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: siliconflow/FlagGems
          ref: 2d9f6e395c3dd4642c0bf301be11629356eb92df
          fetch-depth: 1
          path: operator-source
      - name: Check out the pinned IX operator (attempt 5)
        id: operator-checkout-5
        if: ${{ !cancelled() && steps.operator-checkout-4.outcome == 'failure' }}
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: siliconflow/FlagGems
          ref: 2d9f6e395c3dd4642c0bf301be11629356eb92df
          fetch-depth: 1
          path: operator-source
      - name: Install FlagGems using the current IX runtime image
        id: setup
        working-directory: operator-source
        shell: bash --login -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = 2d9f6e395c3dd4642c0bf301be11629356eb92df
          mkdir -p ../ix-results
          git rev-parse HEAD > ../ix-results/operator-sha.txt
          git apply --check ../.github/scripts/iluvatar-embedding-bag-async-warmup.patch
          git apply ../.github/scripts/iluvatar-embedding-bag-async-warmup.patch
          git diff > ../ix-results/candidate.patch
          # Match backend-test.yaml: retain image compiler/deps and reconcile.
          # Keep the requested five attempts, each bounded at five minutes.
          retry_install() {
            for attempt in 1 2 3 4 5; do
              if timeout --kill-after=10s 300s "$@"; then return 0; fi
              if [[ "$attempt" == 5 ]]; then return 1; fi
              sleep 10
            done
          }
          {
            pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
            pip config set global.extra-index-url "https://mirrors.aliyun.com/pypi/simple/ https://mirrors.cloud.tencent.com/pypi/simple/"
            pip config set global.trusted-host "pypi.tuna.tsinghua.edu.cn mirrors.aliyun.com mirrors.cloud.tencent.com"
            retry_install pip install --no-deps .
            retry_install python3 tools/reconcile_backend_deps.py iluvatar
            retry_install pip install '.[test]'
            bash tools/gpu_check_iluvatar.sh
            python3 -c 'import torch; torch.empty(1, device="cuda"); torch.cuda.synchronize()'
            python3 -c 'import inspect, flag_gems; print(flag_gems.__file__); print(inspect.getfile(flag_gems._embedding_bag)); print(inspect.getfile(flag_gems._embedding_bag_backward))'
            python3 -m pip freeze > ../ix-results/environment.txt
          } 2>&1 | tee ../ix-results/setup.stdout.log
      - name: Run isolated pytest exception checks
        id: probes
        continue-on-error: true
        timeout-minutes: 20
        working-directory: operator-source
        shell: bash --login -e -o pipefail {0}
        run: |
          ulimit -c 0
          python3 -m pytest -c /dev/null -s -vv ../.github/scripts/test_iluvatar_async_errors.py --durations=0 --junitxml=../ix-results/probes.xml 2>&1 | tee ../ix-results/probes.stdout.log
      - name: Upload probe evidence before precision tests
        if: ${{ always() && steps.probes.outcome != 'skipped' && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ix-embedding-bag-probes-${{ github.run_id }}
          path: |
            ix-results/probes.stdout.log
            ix-results/probes.xml
            ix-results/environment.txt
            ix-results/operator-sha.txt
            ix-results/candidate.patch
          if-no-files-found: warn
      - name: Run IX embedding bag precision coverage
        id: accuracy
        continue-on-error: true
        timeout-minutes: 45
        working-directory: operator-source
        shell: bash --login -e -o pipefail {0}
        run: |
          ulimit -c 0
          python3 -m pytest tests/test_embedding_bag.py tests/test_embedding_bag_backward.py -q --tb=short --durations=0 --junitxml=../ix-results/accuracy.xml 2>&1 | tee ../ix-results/accuracy.stdout.log
      - name: Compare pinned and candidate performance after accuracy passes
        id: performance
        if: ${{ !cancelled() && steps.probes.outcome == 'success' && steps.accuracy.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 40
        working-directory: operator-source
        shell: bash --login -e -o pipefail {0}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/.github/scripts${PYTHONPATH:+:$PYTHONPATH}"
          for repetition in 1 2 3; do
            variants="baseline candidate"
            if [[ "$repetition" == 2 ]]; then variants="candidate baseline"; fi
            for variant in $variants; do
              plugin=()
              if [[ "$variant" == baseline ]]; then plugin=(-p ix_embedding_bag_baseline); fi
              python3 -m pytest benchmark/test_embedding_bag.py benchmark/test_embedding_bag_backward.py \
                "${plugin[@]}" -q -s --tb=short --record=json \
                --output="../ix-results/performance-$variant-$repetition.json" \
                2>&1 | tee "../ix-results/performance-$variant-$repetition.stdout.log"
            done
          done
      - name: Require both diagnostic phases to pass
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        env:
          PROBES_OUTCOME: ${{ steps.probes.outcome }}
          ACCURACY_OUTCOME: ${{ steps.accuracy.outcome }}
          PERFORMANCE_OUTCOME: ${{ steps.performance.outcome }}
        run: |
          test "$PROBES_OUTCOME" = success
          test "$ACCURACY_OUTCOME" = success
          test "$PERFORMANCE_OUTCOME" = success
      - name: Preserve diagnostics even when assertions fail
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ix-embedding-bag-${{ github.run_id }}
          path: ix-results/
          if-no-files-found: warn
